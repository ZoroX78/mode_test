    "pandas>=2.2,<3",
    "pandas-ta>=0.3.14b",
    "pyarrow>=14",
    "pytorch-forecasting>=1.8.0",
    "pytorch-lightning>=2.6.5",
    "tensorboard>=2.21.0",
    "tensorboardx>=2.6.5",
    "torch>=2.13.0",
    "tqdm>=4.66",
    "yfinance>=0.2.40",
]

[tool.uv]
package = false
