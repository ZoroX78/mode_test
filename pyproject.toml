    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.1",
    "numpy>=1.26,<2.3",
    "pandas>=2.2,<3",
    "pandas-ta>=0.3.14b",
    "pyarrow>=14",
    "pytorch-forecasting>=1.8.0",
    "pytorch-lightning>=2.6.5",
    "sentence-transformers>=5.6.1",
    "tensorboard>=2.21.0",
    "tensorboardx>=2.6.5",
    "torch>=2.13.0",
